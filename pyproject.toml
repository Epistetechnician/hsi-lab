[project]
name = "hsi-lab"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[project.scripts]
hsi = "hsi.cli:main"

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.20",
]
torch = [
    "torch>=2.4",
    "transformers>=4.46,<5",
    "safetensors>=0.4",
    "accelerate>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "ISC", "PLR0124"]

[tool.ruff.lint.per-file-ignores]
"src/hsi/learning/train.py" = ["B023"]  # closures are invoked immediately inside the loop

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
