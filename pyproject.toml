[project]
name = "hsi-lab"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[project.scripts]
hsi = "hsi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
