name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # torch tests skipped (not installed); the deselected test reads a local ~/hsi-runs artifact
      - run: |
          uv run pytest -q -x --ignore=tests/integration/test_torch_backend.py \
          --deselect tests/integration/test_e6_ground.py::test_confirm_template_preregisters_depth2_in_distribution
